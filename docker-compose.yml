services:
    postgres:
        image: postgres:16
        container_name: devops-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: devops
            POSTGRES_PASSWORD: devops
            POSTGRES_DB: devops_db
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./init-scripts:/docker-entrypoint-initdb.d
        ports:
            - 1337:5432
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U devops -d devops_db']
            interval: 10s
            timeout: 5s
            retries: 5

    block-service:
        build:
            context: .
            dockerfile: blocklist/Dockerfile
        ports:
            - '3000:3000'
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    pgdata:
