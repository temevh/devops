stages:
    - build
    - test
    - package
    - smoketest

variables:
    IMAGE_NAME: 'log-service'

build:
    stage: build
    tags:
        - SE140-2026
    image:
        name: quay.io/podman/stable
        pull_policy: always
    script:
        - podman build -f log/Dockerfile -t ${IMAGE_NAME}:latest .
        - podman save -o log-service.tar ${IMAGE_NAME}:latest
    artifacts:
        name: logservice-artifact
        paths:
            - log-service.tar

test:
    stage: test
    tags:
        - SE140-2026
    image:
        name: quay.io/podman/stable
        pull_policy: always
    script:
        - podman load -i log-service.tar
        - podman run --name test-container ${IMAGE_NAME}:latest npx tsx --test --test-force-exit --test-reporter=junit --test-reporter-destination=test-report.xml log/logService.test.ts || TEST_EXIT=$?
        - podman cp test-container:/app/test-report.xml ./test-report.xml
        - podman rm test-container
        - exit ${TEST_EXIT:-0}
    artifacts:
        name: logservice-test-report
        when: always
        reports:
            junit: test-report.xml

package:
    stage: package
    tags:
        - SE140-2026
    image:
        name: quay.io/podman/stable
        pull_policy: always
    variables:
        PACKAGE_NAME: 'package:${CI_COMMIT_SHORT_SHA}'
    script:
        - podman load -i log-service.tar
        - |
            cat <<EOF > Dockerfile
            FROM log-service:latest
            EXPOSE 1337
            ENV PORT=1337
            CMD ["npx", "tsx", "log/logService.ts"]
            EOF
        - podman build -t "$PACKAGE_NAME" .
        - mkdir -p package-artifact
        - podman save "$PACKAGE_NAME" | gzip -9  > package-artifact/devops-package.tar.gz
    artifacts:
        name: package-artifact
        paths:
            - package-artifact/devops-package.tar.gz
        when: on_success

smoketest:
    stage: smoketest
    tags:
        - SE140-2026
    image:
        name: quay.io/podman/stable
        pull_policy: always
    variables:
        PACKAGE_NAME: 'package:${CI_COMMIT_SHORT_SHA}'
    dependencies:
        - package
    script:
        - ls -lh package-artifact/
        - gzip -dc package-artifact/devops-package.tar.gz | podman load
        - podman run -d --name package-smoketest -p 1337:1337 "$PACKAGE_NAME"
        - sleep 5
        - podman ps -a
        - podman logs package-smoketest
        - curl --fail -v http://127.0.0.1:1337/
    after_script:
        - podman rm -f package-smoketest || true
