services:
    postgres:
        image: postgres:16
        container_name: devops-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: devops
            POSTGRES_PASSWORD: devops
            POSTGRES_DB: devops_db
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./init-scripts:/docker-entrypoint-initdb.d
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U devops -d devops_db']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - db-net

    block-service:
        build:
            context: .
            dockerfile: blocklist/Dockerfile
        container_name: block-service
        environment:
            DB_HOST: devops-postgres
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - app-net
            - db-net

    api-service:
        build:
            context: .
            dockerfile: api/Dockerfile
        container_name: api-service
        ports:
            - '8199:8199'
        depends_on:
            block-service:
                condition: service_started
            log-service:
                condition: service_started
        networks:
            - app-net

    log-service:
        build:
            context: .
            dockerfile: log/Dockerfile
        container_name: log-service
        networks:
            - app-net
        volumes:
            - logdata:/app/data
        environment:
            LOG_DIR: /app/data

volumes:
    pgdata:
    logdata:

networks:
    app-net:
        driver: bridge
    db-net:
        driver: bridge
        internal: true
